[workspace]
resolver = "3"
members = ["end2end", "frontend", "server"]

# need to be applied only to wasm build
[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'

[workspace.package]
version = "0.23.1"
edition = "2024"
rust-version = "1.88.0"
authors = ["Angelos Drossos"]
keywords = ["tasks"]
license-file = "LICENSE"
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
ahash = "0.8.12"
anyhow = { version = "1.0.100", features = ["backtrace"] }
assert_fs = "1.1.3"
axum = "0.8.4"
base64 = "0.22"
cfg-if = "1.0.0"
chrono = { version = "0.4.43", default-features = false }
clap = { version = "4.5.54", features = ["derive"] }
clap-verbosity-flag = { version = "3.0.4", default-features = false, features = [
  "tracing",
] }
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
derive_more = "2.1.1"
futures = "0.3.31"
http = "1.3.1"
indexmap = "2.13.0"
indoc = "2.0.7"
leptos = { version = "0.8.2", features = ["tracing"] }
leptos_meta = "0.8.2"
leptos_router = "0.8.2"
leptos_axum = "0.8.2"
miette = "7.6.0"
predicates = "3.1.4"
rand = "0.10"
rmcp = { version = "3.0.1", features = ["reqwest"] }
schemars = { version = "1.2.1", default-features = false }
secrecy = "0.10.3"
serde = "1.0.228"
serde_json = "1.0.149"
serde_with = "3.17.0"
sha2 = "0.10"
strum = { version = "0.26", features = ["derive"] }
sublime_fuzzy = "0.7.0"
thiserror = "2.0.12"
tokio = "1.40.0"
tokio-util = "0.7.18"
toml = "0.9"
tower = { version = "0.5.2", features = ["full"] }
tower-http = { version = "0.6.4", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
tracing-test = "0.2.6"
url = "2.5"
uuid = "1.19.0"
wasm-bindgen = "0.2.106"
web-sys = { version = "0.3", default-features = false }

[[workspace.metadata.leptos]]
name = "kid"
bin-package = "kid-server"
lib-package = "kid-frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
browserquery = "defaults"
watch = false
env = "DEV"
tailwind-input-file = "style/tailwind.css"
end2end-dir = "end2end"
end2end-cmd = "cargo test --test browser"
