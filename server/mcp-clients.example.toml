# Example configuration for --mcp-clients-file / KID_MCP_CLIENTS_FILE.
#
# Lists the OAuth clients allowed to authenticate against the MCP server.
# Copy this file, fill in real redirect URIs and secrets, and
# point --mcp-clients-file at it.
#
# An unset or empty file disables MCP OAuth entirely
# (no client can complete the authorization flow).
#
# `client-id` is this client's OAuth client_id - the value it
# authenticates with. It must be unique. Every change the client makes is
# recorded as `<prefix>:<name>:<on-behalf-of>` - `name`, `prefix` and
# `on-behalf-of` don't affect authentication, only that actor string, and
# are fixed here rather than tool parameters a client could claim for
# itself. `name` is not required to be unique - e.g. rotating a client's
# credential can keep the same `name` across old and new `client-id`, so
# the actor trail stays attributed to the same identity.
#
# `prefix` is a closed set - currently just "ai", for AI assistants - and
# fails to parse on anything else, rather than silently accepting a typo as
# a new prefix. Omit it for clients that aren't AI assistants.
#
# `on-behalf-of` is optional: omit it for a read-only client (no human to
# attribute changes to, so mutating tools are rejected for it).

[[client]]
client-id = "mcp-inspector"
name = "mcp-inspector"
redirect-uri = "http://localhost:6274/oauth/callback"
secret = "replace-with-a-generated-secret"
on-behalf-of = "Jane"

[[client]]
prefix = "ai"
client-id = "example-ai-client"
name = "example.ai"
redirect-uri = "https://example.ai/api/mcp/auth_callback"
secret = "replace-with-a-another-generated-secret"
on-behalf-of = "Jane"

# Machine client (e.g. a systemd-triggered one-shot job): no user is
# present to approve an authorization_code flow, so it authenticates via
# the client_credentials grant instead. redirect-uri can be omitted.
# Read-only, since no on-behalf-of is configured.
[[client]]
client-id = "matrix-relay-client"
name = "matrix-relay"
secret = "replace-with-yet-another-generated-secret"
